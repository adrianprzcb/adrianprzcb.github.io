<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open a little moment of luck with Fortune Cookie App, available on Google Play.">
  <meta name="theme-color" content="#fff8e7">
  <title>Fortune Cookie App</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2e1c12;
      --muted: #765f50;
      --cream: #fff8e7;
      --paper: rgba(255, 255, 255, .76);
      --orange: #e87924;
      --orange-dark: #be4f0e;
      --line: rgba(83, 48, 25, .14);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 194, 99, .32), transparent 29rem),
        radial-gradient(circle at 90% 82%, rgba(231, 121, 36, .16), transparent 28rem),
        var(--cream);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 14rem;
      height: 14rem;
      border: 1px solid rgba(190, 79, 14, .12);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before { top: -7rem; right: -5rem; }
    body::after { bottom: -8rem; left: -4rem; }

    main {
      width: min(680px, 100%);
      padding: clamp(36px, 7vw, 72px);
      text-align: center;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 32px;
      box-shadow: 0 28px 80px rgba(91, 50, 20, .14);
      backdrop-filter: blur(14px);
    }

    .cookie {
      display: grid;
      place-items: center;
      width: 104px;
      height: 104px;
      margin: 0 auto 26px;
      font-size: 58px;
      background: linear-gradient(145deg, #fff, #ffefd0);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(123, 68, 27, .13);
      transform: rotate(-3deg);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--orange-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 500px;
      margin: 22px auto 34px;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.16rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .button.primary {
      color: #fff;
      border-color: var(--orange);
      background: var(--orange);
      box-shadow: 0 10px 24px rgba(190, 79, 14, .23);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(82, 45, 19, .13);
    }

    .button.primary:hover { background: var(--orange-dark); }
    .button:focus-visible { outline: 3px solid rgba(232, 121, 36, .35); outline-offset: 3px; }

    footer {
      margin-top: 34px;
      color: #967a67;
      font-size: .82rem;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      main { border-radius: 24px; }
      .actions { align-items: stretch; flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="cookie" aria-hidden="true">🥠</div>
    <p class="eyebrow">A little luck, every day</p>
    <h1>Fortune Cookie</h1>
    <p class="intro">Crack open a daily fortune for a quick dose of wisdom, inspiration, and fun.</p>
    <div class="actions">
      <a class="button primary" href="https://play.google.com/store/apps/details?id=com.adrian.fortunecookieapp">Get it on Google Play</a>
      <a class="button" href="fortune-cookie-app-privacy-policy.html">Privacy policy</a>
    </div>
    <footer>Made by RUSHERS ADR</footer>
  </main>
</body>
</html>
